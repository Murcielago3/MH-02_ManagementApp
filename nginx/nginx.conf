# ─────────────────────────────────────────────────────────────────────────
# nginx config for the prod docker-compose stack.
#   - HTTP (80): serves Let's Encrypt ACME challenges; redirects all other
#     traffic to HTTPS on the canonical host.
#   - HTTPS (443): serves the Vue SPA and proxies /api + /static to FastAPI.
# Canonical host: www.mh02dashboard.com
# ─────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    server_name _;

    # Must stay reachable on port 80 so certbot can renew.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS (canonical host).
    location / {
        return 301 https://www.mh02dashboard.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.mh02dashboard.com mh02dashboard.com;

    ssl_certificate     /etc/letsencrypt/live/www.mh02dashboard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mh02dashboard.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Compress text responses. The SPA ships ~2 MB of JS/CSS assets; gzip cuts
    # the transfer roughly 3x. Images/fonts (woff2) are already compressed and
    # are deliberately left out.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/vnd.ms-fontobject image/svg+xml;

    # API proxy → FastAPI
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # Backend-served uploads / logos
    location /static/ {
        proxy_pass http://api:8000/static/;
        proxy_set_header Host $host;
    }

    # Hashed build assets are content-addressed and immutable — cache forever.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue SPA. index.html must NOT be cached, so a new deploy's chunk hashes are
    # picked up immediately (otherwise a stale index.html points at chunk files
    # that no longer exist → "Failed to fetch dynamically imported module").
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
